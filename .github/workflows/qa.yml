name: QA smoke tests
on:
  push:
    branches: [qa-next-update]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - run: python3 -m http.server 8765 --directory dist & sleep 2; node tests/browser.cjs
