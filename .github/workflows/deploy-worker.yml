name: Deploy hahn-heroes Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hahn-heroes-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://reccddfusealreknvjfj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0lgGi-nNahJtzBObQIbI-A_fwYczmEo

      - name: Deploy hahn-heroes Worker
        run: npx wrangler deploy --config wrangler.jsonc --name hahn-heroes --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d255bc53d24028847388c35ce8d848c7
